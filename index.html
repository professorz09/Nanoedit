<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nano Edit - AI Image Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              nano: {
                bg: '#0f0f11',
                card: '#18181b',
                accent: '#ccff00', // The lime green from the screenshot
                accentHover: '#b3e600',
                text: '#f4f4f5',
                muted: '#71717a'
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #0f0f11;
        color: #f4f4f5;
        font-family: 'Inter', sans-serif;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #18181b; }
      ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #52525b; }

      /* ── Fade-in-up animation ── */
      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* ── Shimmer / skeleton ── */
      @keyframes shimmer {
        0%   { background-position: -400% 0; }
        100% { background-position:  400% 0; }
      }
      .animate-shimmer {
        background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
        background-size: 400% 100%;
        animation: shimmer 1.6s ease infinite;
      }

      /* ── No-scrollbar utility ── */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* ── Smooth image fade-in on load ── */
      @keyframes img-appear {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      .img-fade { animation: img-appear 0.4s ease both; }

      /* ── Mobile tools smooth reveal ── */
      .tools-reveal {
        display: flex;
        overflow: hidden;
        transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                    opacity 0.25s ease;
      }
      .tools-reveal.collapsed {
        max-height: 0 !important;
        opacity: 0;
        pointer-events: none;
      }
      .tools-reveal.expanded {
        max-height: 200px;
        opacity: 1;
      }

      /* ── Error auto-dismiss progress bar ── */
      @keyframes progress-shrink {
        from { width: 100%; }
        to   { width: 0%; }
      }

      /* ── Active press feedback ── */
      button:active:not(:disabled) { transform: scale(0.97); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",

  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</html>
